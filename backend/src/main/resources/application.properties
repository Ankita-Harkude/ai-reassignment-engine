spring.application.name=reassignment-engine
# 8081, not 8080: 8080 is commonly taken (e.g. Oracle XE's HTTP listener). Override with PORT.
server.port=${PORT:8081}

# --- H2 (in-memory, dev/test only) ---
spring.datasource.url=jdbc:h2:mem:ziprun;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info

# Strict request bodies: an unknown JSON field is a 400, not silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Routing: initial strategy (rule-based | ai). Switchable at runtime via PATCH /routing/strategy ---
routing.strategy=${ROUTING_STRATEGY:rule-based}

# --- LLM (key comes from the environment only; never commit it) ---
# provider: gemini | groq | ollama
llm.provider=${LLM_PROVIDER:gemini}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-2.5-flash}
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com}
llm.connect-timeout-ms=3000
llm.read-timeout-ms=15000

# --- CORS (React dev server / Angular dev server) ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:4200
